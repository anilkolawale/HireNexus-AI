name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Test_password123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test_password123 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore ATS.sln

      - name: Build
        working-directory: backend
        run: dotnet build ATS.sln --no-restore --configuration Release

      - name: Run unit tests
        working-directory: backend
        run: dotnet test tests/ATS.UnitTests/ATS.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        working-directory: backend
        run: dotnet test tests/ATS.IntegrationTests/ATS.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

      - name: Publish API artifact
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        run: dotnet publish src/ATS.API/ATS.API.csproj -c Release -o ./publish

      - name: Upload API artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: backend/publish
